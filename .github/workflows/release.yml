# Builds the portable Windows exe (npm run dist) and attaches it to the GitHub release.
# - Publishing a release with a tag like v0.2.0 builds version 0.2.0: the tag sets the version in
#   package.json for the build (and with it the exe's name), so it needn't be bumped first.
# - Run it by hand (Actions → Release build → Run workflow) for a test build: the exe is then kept
#   as the run's artifact instead.
name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # to attach the exe to the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30 # a build takes a few minutes; don't let a hung one run for the default 6 hours
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The lockfile has node-sdl as a git+ssh URL, and the runner has no SSH key: fetch it over HTTPS.
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - run: npm ci

      - name: Take the version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # npm run dist in two steps: on the runner, the dist script's nested `npm run build` ends the
      # script, so electron-builder never ran (and the step still passed).
      - run: npm run build

      # --publish never: on a tag, electron-builder would otherwise try to publish the release itself.
      - run: npx electron-builder --publish never

      - name: Attach the exe to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber

      - name: Keep the exe as the run's artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: SimRail Controllers
          path: release/*.exe
          if-no-files-found: error
